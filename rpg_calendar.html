<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TTRPG Calendar</title>

    <style>
        body {
            background-color: #05070b;
            color: #eee;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1, h2 {
            color: #FF0000;
            border-bottom: 2px solid #FF0000;
            padding-bottom: 5px;
        }


    </style>
</head>

<body>

<h1>TTRPG Calendar Agenda</h1>
<iframe
  title="TTRPG Campaign Agenda"
  style="border: 1px solid #444; border-radius: 8px; background: #1a1a1a;"
  width="60%"
  height="450"
  frameborder="0"
  srcdoc="
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset='UTF-8'>
      <style>
        body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 16px; }
        .agenda-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 16px; color: #ff0000; border-bottom: 2px solid #333; padding-bottom: 8px; }
        .event-card { background: #2a2a2a; border-left: 4px solid #ff0000; padding: 12px; margin-bottom: 12px; border-radius: 0 4px 4px 0; }
        .event-date { font-size: 0.85rem; color: #aaa; font-weight: bold; text-transform: uppercase; }
        .event-name { font-size: 1.05rem; margin: 4px 0; font-weight: 600; }
        .event-desc { font-size: 0.9rem; color: #ccc; margin: 0; }
        .empty-state { text-align: center; color: #666; padding: 40px 0; }
      </style>
    </head>
    <body>
      <div class='agenda-title'>📅 Upcoming Campaign Sessions</div>
      <!-- EDIT YOUR EVENTS HERE -->


      <div class='event-card'>
        <div class='event-date'>Sunday, September 13th @ 14:00</div>
        <div class='event-name'>Star Wars: Session ?</div>
        <div class='event-desc'>Something, something, Dark Side</div>
      </div>

      <div class='event-card'>
        <div class='event-date'>Sunday, September 27th @ 13:30</div>
        <div class='event-name'>Cyberpunk Red: Session 1</div>
        <div class='event-desc'>The Hunt begins</div>
      </div>

      <div class='event-card'>
        <div class='event-date'>Sunday, October 4th @ 13:30</div>
        <div class='event-name'>Traveller: Session 28</div>
        <div class='event-desc'>In which our group continues to hunt.</div>
      </div>

      <!-- END OF EVENTS -->

    </body>
    </html>
  ">
</iframe>


</body>
</html>
